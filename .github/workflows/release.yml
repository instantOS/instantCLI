name: Release
on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
      - CHANGELOG.md
    tags:
      - "v*"
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  metadata:
    name: Prepare release metadata
    runs-on: ubuntu-26.04
    container:
      image: ubuntu:26.04
    if: ${{ github.repository_owner == 'instantOS' }}
    permissions:
      contents: write
    outputs:
      should_release: ${{ steps.metadata.outputs.should_release }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Determine release tag
        id: metadata
        run: bash scripts/ci/determine-release.sh
  build:
    needs: metadata
    if: needs.metadata.outputs.should_release == 'true'
    name: Build release artifacts
    runs-on: ubuntu-26.04
    container:
      image: archlinux:latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Arch container
        uses: ./.github/actions/setup-arch
        with:
          packages: pacman-contrib fzf jq restic unzip python3
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Create build user
        run: |
          useradd -m builder
          chown -R builder:builder "$PWD"
      - name: Determine target triple
        id: target
        run: |
          target=$(rustc -vV | awk '/^host:/ {print $2}')
          if [[ -z "$target" ]]; then
            echo "Failed to determine host target triple" >&2
            exit 1
          fi
          echo "triple=$target" >> "$GITHUB_OUTPUT"
      - name: Extract version
        id: vars
        run: bash scripts/ci/extract-version.sh "$GITHUB_REF_NAME"
      - name: Build release binary
        run: |
          WORKSPACE="$PWD"
          su builder -c "cd '$WORKSPACE' && CARGO_TERM_COLOR=always cargo build --release --locked"
      - name: Strip binary
        run: |
          WORKSPACE="$PWD"
          su builder -c "cd '$WORKSPACE' && strip target/release/ins"
      - name: Collect artifacts
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          TARGET: ${{ steps.target.outputs.triple }}
        run: |
          mkdir -p artifacts
          pkg_dir="ins-${TARGET}-v${VERSION}"
          tmpdir=$(mktemp -d)
          mkdir -p "$tmpdir/$pkg_dir"
          install -Dm0755 "target/release/ins" "$tmpdir/$pkg_dir/ins"
          tar -czf "artifacts/${pkg_dir}.tgz" -C "$tmpdir" "$pkg_dir"
          sha256sum "artifacts/${pkg_dir}.tgz" > "artifacts/${pkg_dir}.tgz.sha256"
          rm -rf "$tmpdir"
      - name: Build AppImage
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          mkdir -p artifacts
          WORKSPACE="$PWD"
          su builder -c "cd '$WORKSPACE' && chmod +x utils/build_appimage.sh && ./utils/build_appimage.sh"
          install -Dm0644 "target/appimage/InstantCLI-${VERSION}-x86_64.AppImage" "artifacts/ins-${VERSION}-x86_64.AppImage"
          sha256sum "artifacts/ins-${VERSION}-x86_64.AppImage" > "artifacts/ins-${VERSION}-x86_64.AppImage.sha256"
      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: ins-${{ steps.vars.outputs.version }}-${{ steps.target.outputs.triple }}
          path: |
            artifacts/ins-${{ steps.target.outputs.triple }}-v${{ steps.vars.outputs.version }}.tgz
            artifacts/ins-${{ steps.target.outputs.triple }}-v${{ steps.vars.outputs.version }}.tgz.sha256
            artifacts/ins-${{ steps.vars.outputs.version }}-x86_64.AppImage
            artifacts/ins-${{ steps.vars.outputs.version }}-x86_64.AppImage.sha256
  cross-compile:
    needs: metadata
    if: needs.metadata.outputs.should_release == 'true'
    name: Cross-compile ${{ matrix.target }}
    runs-on: ubuntu-26.04
    container:
      image: ubuntu:26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            build_target: aarch64-unknown-linux-gnu.2.28
            kind: zig
            pkg: ins-aarch64-unknown-linux-gnu
            artifact: aarch64-unknown-linux-gnu
          - target: armv7-unknown-linux-gnueabihf
            build_target: armv7-unknown-linux-gnueabihf.2.28
            kind: zig
            pkg: ins-armv7-unknown-linux-gnueabihf
            artifact: armv7-unknown-linux-gnueabihf
          - target: x86_64-unknown-linux-musl
            build_target: x86_64-unknown-linux-musl
            kind: zig
            pkg: ins-x86_64-unknown-linux-musl
            artifact: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
            build_target: aarch64-unknown-linux-musl
            kind: zig
            pkg: ins-aarch64-unknown-linux-musl
            artifact: aarch64-unknown-linux-musl
          - target: aarch64-linux-android
            build_target: aarch64-linux-android
            kind: ndk
            pkg: ins-aarch64-termux
            artifact: aarch64-termux
    env:
      CARGO_TERM_COLOR: always
      DEBIAN_FRONTEND: noninteractive
      CARGO_HOME: /opt/cargo
      RUSTUP_HOME: /opt/rustup
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates pkg-config \
            unzip xz-utils
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: llvm-tools-preview
      - name: Install Zig
        if: matrix.kind == 'zig'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.1
          cache-key: ${{ matrix.target }}
      - name: Install cargo-zigbuild
        if: matrix.kind == 'zig'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.4
      - name: Install cargo-ndk
        if: matrix.kind == 'ndk'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2
      - name: Install Android NDK
        if: matrix.kind == 'ndk'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
      - name: Extract version
        id: vars
        run: bash scripts/ci/extract-version.sh "$GITHUB_REF_NAME"
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cross-deps
          key: cross-${{ matrix.target }}
      - name: Cross compile (zig)
        if: matrix.kind == 'zig'
        run: cargo zigbuild --locked --release --features cross-compile --target ${{ matrix.build_target }}
      - name: Build for Android
        if: matrix.kind == 'ndk'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo ndk -t ${{ matrix.build_target }} build --release --locked --features cross-compile
      - name: Strip binary
        run: |
          LLVM_STRIP="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | awk '/^host:/ {print $2}')/bin/llvm-strip"
          "$LLVM_STRIP" "target/${{ matrix.target }}/release/ins"
      - name: Collect artifact
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          PKG: ${{ matrix.pkg }}
          TARGET_DIR: ${{ matrix.target }}
        run: |
          mkdir -p artifacts
          pkg_dir="${PKG}-v${VERSION}"
          tmpdir=$(mktemp -d)
          mkdir -p "$tmpdir/$pkg_dir"
          install -Dm0755 "target/${TARGET_DIR}/release/ins" "$tmpdir/$pkg_dir/ins"
          tar -czf "artifacts/${pkg_dir}.tgz" -C "$tmpdir" "$pkg_dir"
          sha256sum "artifacts/${pkg_dir}.tgz" > "artifacts/${pkg_dir}.tgz.sha256"
          rm -rf "$tmpdir"
      - name: Upload cross-compile artifact
        uses: actions/upload-artifact@v7
        with:
          name: ins-${{ steps.vars.outputs.version }}-${{ matrix.artifact }}
          path: |
            artifacts/${{ matrix.pkg }}-v${{ steps.vars.outputs.version }}.tgz
            artifacts/${{ matrix.pkg }}-v${{ steps.vars.outputs.version }}.tgz.sha256
  pkgbuild:
    needs: metadata
    if: needs.metadata.outputs.should_release == 'true'
    name: Build Arch package
    runs-on: ubuntu-26.04
    container:
      image: archlinux:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Arch container
        uses: ./.github/actions/setup-arch
        with:
          packages: pacman-contrib fzf sqlite sudo
      - name: Extract version
        id: vars
        run: bash scripts/ci/extract-version.sh "$GITHUB_REF_NAME"
      - name: Sync PKGBUILD version
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" pkgbuild/ins/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" pkgbuild/ins/PKGBUILD
      - name: Create build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder:builder "$PWD"
      - name: Build package
        run: |
          cd pkgbuild/ins
          su builder -c 'makepkg -s --noconfirm'
      - name: Collect package artifacts
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          mkdir -p artifacts
          shopt -s nullglob
          for pkg in pkgbuild/ins/*.pkg.tar.zst; do mv "$pkg" artifacts/; done
          for src in pkgbuild/ins/*.src.tar.zst; do mv "$src" artifacts/; done
      - name: Upload Arch package
        uses: actions/upload-artifact@v7
        with:
          name: ins-${{ steps.vars.outputs.version }}-arch-packages
          path: artifacts/
  deb:
    name: Build Debian package
    runs-on: ubuntu-26.04
    container:
      image: ubuntu:26.04
    needs: [metadata, build]
    if: needs.metadata.outputs.should_release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install dependencies
        run: apt-get update && apt-get install -y dpkg-dev
      - name: Extract version
        id: vars
        run: bash scripts/ci/extract-version.sh "$GITHUB_REF_NAME"
      - name: Download native build artifact
        uses: actions/download-artifact@v8
        with:
          name: ins-${{ steps.vars.outputs.version }}-x86_64-unknown-linux-gnu
          path: dist
      - name: Extract binary from tarball
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          tar -xzf "dist/ins-x86_64-unknown-linux-gnu-v${VERSION}.tgz" -C dist
          install -Dm0755 "dist/ins-x86_64-unknown-linux-gnu-v${VERSION}/ins" target/release/ins
      - name: Build .deb package
        run: |
          chmod +x utils/build_deb.sh
          ./utils/build_deb.sh
      - name: Collect deb artifacts
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          mkdir -p artifacts
          mv "target/deb/ins_${VERSION}_amd64.deb" artifacts/
          cd artifacts && sha256sum "ins_${VERSION}_amd64.deb" > "ins_${VERSION}_amd64.deb.sha256"
      - name: Upload deb package
        uses: actions/upload-artifact@v7
        with:
          name: ins-${{ steps.vars.outputs.version }}-deb
          path: artifacts/
  apk:
    name: Build Alpine package (${{ matrix.arch }})
    runs-on: ubuntu-26.04
    needs: [metadata, cross-compile]
    if: needs.metadata.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Extract version
        id: vars
        run: bash scripts/ci/extract-version.sh "$GITHUB_REF_NAME"
      - name: Download musl build artifact
        uses: actions/download-artifact@v8
        with:
          name: ins-${{ steps.vars.outputs.version }}-${{ matrix.arch }}-unknown-linux-musl
          path: dist
      - name: Extract binary from tarball
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: tar -xzf "dist/ins-${ARCH}-unknown-linux-musl-v${VERSION}.tgz" -C dist
      - name: Build .apk package
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work -e ARCH -e VERSION alpine:3.22 sh -ec '
            apk add --no-cache abuild binutils
            SUDO= abuild-keygen -a -n -i
            ./utils/build_apk.sh "dist/ins-${ARCH}-unknown-linux-musl-v${VERSION}/ins" "$ARCH"
          '
      - name: Smoke test Alpine installation
        if: matrix.arch == 'x86_64'
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          docker run --rm -v "$PWD/target/apk:/packages:ro" -e VERSION alpine:3.22 sh -ec '
            cd /packages
            sha256sum -c "ins-${VERSION}-r0-x86_64.apk.sha256"
            apk add --no-cache --allow-untrusted "./ins-${VERSION}-r0-x86_64.apk"
            ins --version
            ins --help > /dev/null
            apk info -e ins bash fzf git
            test -f /usr/share/applications/ins-settings.desktop
            test -f /usr/share/licenses/ins/emoji-catalog-LICENSE
            test -f /usr/lib/systemd/user/ins-notify.service
          '
      - name: Upload apk package
        uses: actions/upload-artifact@v7
        with:
          name: ins-${{ steps.vars.outputs.version }}-apk-${{ matrix.arch }}
          path: |
            target/apk/*.apk
            target/apk/*.apk.sha256
  release:
    name: Publish GitHub release
    runs-on: ubuntu-26.04
    container:
      image: ubuntu:26.04
    needs:
      - metadata
      - build
      - cross-compile
      - pkgbuild
      - deb
      - apk
    permissions:
      contents: write
    if: needs.metadata.outputs.should_release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Extract release notes
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: bash scripts/ci/extract-release-notes.sh "$VERSION" > release-notes.md
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: ${{ needs.metadata.outputs.tag }}
          body_path: release-notes.md
          files: dist/**/*
          # AUR recipes pin release asset checksums across reruns.
          overwrite_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  aur-recipes:
    name: Prepare AUR recipes
    runs-on: ubuntu-26.04
    container:
      image: archlinux:latest
    needs: [metadata, release]
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Arch container
        uses: ./.github/actions/setup-arch
        with:
          include-test-base: 'false'
          packages: base-devel pacman-contrib fzf git sqlite
      - name: Generate versioned recipes
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          useradd -m builder
          chown -R builder:builder pkgbuild
          for package in ins ins-bin; do
            recipe="pkgbuild/$package"
            sed -i "s/^pkgver=.*/pkgver=$VERSION/; s/^pkgrel=.*/pkgrel=1/" "$recipe/PKGBUILD"
            (
              cd "$recipe"
              runuser -u builder -- updpkgsums
              runuser -u builder -- makepkg --printsrcinfo > .SRCINFO
            )
            install -Dm644 "$recipe/PKGBUILD" "aur-recipes/$package/PKGBUILD"
            install -Dm644 "$recipe/.SRCINFO" "aur-recipes/$package/.SRCINFO"
          done
      - name: Smoke test ins-bin installation
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          cd pkgbuild/ins-bin
          runuser -u builder -- makepkg --noconfirm
          pacman -U --noconfirm "ins-bin-$VERSION-1-x86_64.pkg.tar.zst"
          ins --version
          ins --help > /dev/null
          test -f /usr/share/applications/ins-settings.desktop
          test -f /usr/lib/systemd/user/ins-notify.service
          test -f /usr/share/licenses/ins/emoji-catalog-LICENSE
      - name: Upload AUR recipes
        uses: actions/upload-artifact@v7
        with:
          name: aur-recipes
          path: aur-recipes/
          include-hidden-files: true
          if-no-files-found: error
  aur:
    name: Publish to the AUR
    runs-on: ubuntu-26.04
    container:
      image: archlinux:latest
    needs: aur-recipes
    if: |-
      github.repository == 'instantOS/instantCLI' &&
      (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && github.ref_protected))
    concurrency:
      group: aur-publish
      cancel-in-progress: false
    steps:
      - name: Check for AUR SSH key
        id: aur-key
        env:
          KEY_CONFIGURED: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
        run: |
          echo "configured=$KEY_CONFIGURED" >> "$GITHUB_OUTPUT"
          if [[ "$KEY_CONFIGURED" != true ]]; then
            echo 'AUR_SSH_PRIVATE_KEY is unset. Skipping AUR publishing.'
          fi
      - name: Install publishing tools
        if: steps.aur-key.outputs.configured == 'true'
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed git openssh
      - name: Checkout release commit
        if: steps.aur-key.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download AUR recipes
        if: steps.aur-key.outputs.configured == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aur-recipes
          path: aur-recipes
      - name: Push recipes to the AUR
        if: steps.aur-key.outputs.configured == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: bash scripts/ci/publish-aur.sh aur-recipes
  npm:
    name: Publish npm packages
    runs-on: ubuntu-26.04
    needs:
      - metadata
      - cross-compile
      - release
    if: github.repository == 'instantOS/instantCLI' && needs.metadata.outputs.should_release == 'true'
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-${{ needs.metadata.outputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.tag }}
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Download musl binaries
        uses: actions/download-artifact@v8
        with:
          pattern: ins-*-*-unknown-linux-musl
          path: npm-artifacts
          merge-multiple: true
      - name: Stage npm packages
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: python3 npm/build-packages.py --artifacts npm-artifacts --output target/npm --tag "$RELEASE_TAG"
      - name: Smoke test Linux x64 binary
        run: |
          target/npm/cli-linux-x64/bin/ins --version
          target/npm/cli-linux-x64/bin/ins --help > /dev/null
      - name: Check package contents
        run: |
          for package in target/npm/*; do
            npm pack "$PWD/$package" --dry-run
          done
      - name: Publish binaries and launcher
        run: node npm/publish.cjs target/npm
        env:
          # Bootstrap with a granular token; remove it after configuring OIDC on all three packages.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
