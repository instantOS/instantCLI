name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Arch container
        uses: ./.github/actions/setup-arch
        with:
          packages: pacman-contrib fzf jq restic unzip python3
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Create build user
        run: |
          useradd -m builder
          chown -R builder:builder "$PWD"
      - name: Determine target triple
        id: target
        run: |
          target=$(rustc -vV | awk '/^host:/ {print $2}')
          if [[ -z "$target" ]]; then
            echo "Failed to determine host target triple" >&2
            exit 1
          fi
          echo "triple=$target" >> "$GITHUB_OUTPUT"
      - name: Extract version
        id: vars
        run: |
          version=$(awk -F '"' '/^version =/ {print $2; exit}' Cargo.toml)
          if [[ -z "$version" ]]; then
            echo "Failed to determine version from Cargo.toml" >&2
            exit 1
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ -n "$tag_version" && "$tag_version" != "$version" ]]; then
            echo "Tag version $tag_version does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build release binary
        run: |
          WORKSPACE="$PWD"
          su builder -c "cd '$WORKSPACE' && CARGO_TERM_COLOR=always cargo build --release --locked"
      - name: Strip binary
        run: |
          WORKSPACE="$PWD"
          su builder -c "cd '$WORKSPACE' && strip target/release/ins"
      - name: Collect artifacts
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          TARGET: ${{ steps.target.outputs.triple }}
        run: |
          mkdir -p artifacts
          pkg_dir="ins-${TARGET}-v${VERSION}"
          tmpdir=$(mktemp -d)
          mkdir -p "$tmpdir/$pkg_dir"
          install -Dm0755 "target/release/ins" "$tmpdir/$pkg_dir/ins"
          tar -czf "artifacts/${pkg_dir}.tgz" -C "$tmpdir" "$pkg_dir"
          sha256sum "artifacts/${pkg_dir}.tgz" > "artifacts/${pkg_dir}.tgz.sha256"
          rm -rf "$tmpdir"
      - name: Build AppImage
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          mkdir -p artifacts
          WORKSPACE="$PWD"
          su builder -c "cd '$WORKSPACE' && chmod +x utils/build_appimage.sh && ./utils/build_appimage.sh"
          install -Dm0644 "target/appimage/InstantCLI-${VERSION}-x86_64.AppImage" "artifacts/ins-${VERSION}-x86_64.AppImage"
          sha256sum "artifacts/ins-${VERSION}-x86_64.AppImage" > "artifacts/ins-${VERSION}-x86_64.AppImage.sha256"
      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: ins-${{ steps.vars.outputs.version }}-${{ steps.target.outputs.triple }}
          path: |
            artifacts/ins-${{ steps.target.outputs.triple }}-v${{ steps.vars.outputs.version }}.tgz
            artifacts/ins-${{ steps.target.outputs.triple }}-v${{ steps.vars.outputs.version }}.tgz.sha256
            artifacts/ins-${{ steps.vars.outputs.version }}-x86_64.AppImage
            artifacts/ins-${{ steps.vars.outputs.version }}-x86_64.AppImage.sha256
  cross-compile:
    name: Cross-compile ${{ matrix.target }}
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            build_target: aarch64-unknown-linux-gnu.2.17
            kind: zig
            pkg: ins-aarch64-unknown-linux-gnu
            artifact: aarch64-unknown-linux-gnu
          - target: armv7-unknown-linux-gnueabihf
            build_target: armv7-unknown-linux-gnueabihf.2.17
            kind: zig
            pkg: ins-armv7-unknown-linux-gnueabihf
            artifact: armv7-unknown-linux-gnueabihf
          - target: x86_64-unknown-linux-musl
            build_target: x86_64-unknown-linux-musl
            kind: zig
            pkg: ins-x86_64-unknown-linux-musl
            artifact: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
            build_target: aarch64-unknown-linux-musl
            kind: zig
            pkg: ins-aarch64-unknown-linux-musl
            artifact: aarch64-unknown-linux-musl
          - target: aarch64-linux-android
            build_target: aarch64-linux-android
            kind: ndk
            pkg: ins-aarch64-termux
            artifact: aarch64-termux
    env:
      CARGO_TERM_COLOR: always
      DEBIAN_FRONTEND: noninteractive
      CARGO_HOME: /opt/cargo
      RUSTUP_HOME: /opt/rustup
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates pkg-config \
            unzip xz-utils
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: llvm-tools-preview
      - name: Install zig
        if: matrix.kind == 'zig'
        env:
          ZIG_VERSION: 0.15.1
          ZIG_SHASUM: c61c5da6edeea14ca51ecd5e4520c6f4189ef5250383db33d01848293bfafe05
        run: |
          set -euo pipefail
          tarball="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 15 --max-time 300 \
            "https://ziglang.org/download/${ZIG_VERSION}/${tarball}" -o "/tmp/${tarball}"
          echo "${ZIG_SHASUM}  /tmp/${tarball}" | sha256sum -c -
          tar xf "/tmp/${tarball}" -C /opt
          rm "/tmp/${tarball}"
          echo "/opt/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
          "/opt/zig-x86_64-linux-${ZIG_VERSION}/zig" version
      - name: Install cargo-zigbuild
        if: matrix.kind == 'zig'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23
      - name: Install cargo-ndk
        if: matrix.kind == 'ndk'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2
      - name: Install Android NDK
        if: matrix.kind == 'ndk'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          local-cache: true
      - name: Extract version
        id: vars
        run: |
          version=$(awk -F '"' '/^version =/ {print $2; exit}' Cargo.toml)
          if [[ -z "$version" ]]; then
            echo "Failed to determine version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cross-deps
          key: cross-${{ matrix.target }}
      - name: Cross compile (zig)
        if: matrix.kind == 'zig'
        run: cargo zigbuild --locked --release --features cross-compile --target ${{ matrix.build_target }}
      - name: Build for Android
        if: matrix.kind == 'ndk'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo ndk -t ${{ matrix.build_target }} build --release --locked --features cross-compile
      - name: Strip binary
        run: |
          LLVM_STRIP="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | awk '/^host:/ {print $2}')/bin/llvm-strip"
          "$LLVM_STRIP" "target/${{ matrix.target }}/release/ins"
      - name: Collect artifact
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          PKG: ${{ matrix.pkg }}
          TARGET_DIR: ${{ matrix.target }}
        run: |
          mkdir -p artifacts
          pkg_dir="${PKG}-v${VERSION}"
          tmpdir=$(mktemp -d)
          mkdir -p "$tmpdir/$pkg_dir"
          install -Dm0755 "target/${TARGET_DIR}/release/ins" "$tmpdir/$pkg_dir/ins"
          tar -czf "artifacts/${pkg_dir}.tgz" -C "$tmpdir" "$pkg_dir"
          sha256sum "artifacts/${pkg_dir}.tgz" > "artifacts/${pkg_dir}.tgz.sha256"
          rm -rf "$tmpdir"
      - name: Upload cross-compile artifact
        uses: actions/upload-artifact@v7
        with:
          name: ins-${{ steps.vars.outputs.version }}-${{ matrix.artifact }}
          path: |
            artifacts/${{ matrix.pkg }}-v${{ steps.vars.outputs.version }}.tgz
            artifacts/${{ matrix.pkg }}-v${{ steps.vars.outputs.version }}.tgz.sha256
  pkgbuild:
    name: Build Arch package
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Arch container
        uses: ./.github/actions/setup-arch
        with:
          packages: pacman-contrib fzf sqlite sudo
      - name: Extract version
        id: vars
        run: |
          version=$(awk -F '"' '/^version =/ {print $2; exit}' Cargo.toml)
          if [[ -z "$version" ]]; then
            echo "Failed to determine version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Sync PKGBUILD version
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" pkgbuild/ins/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" pkgbuild/ins/PKGBUILD
      - name: Create build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder:builder "$PWD"
      - name: Build package
        run: |
          cd pkgbuild/ins
          su builder -c 'makepkg -s --noconfirm'
      - name: Collect package artifacts
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          mkdir -p artifacts
          shopt -s nullglob
          for pkg in pkgbuild/ins/*.pkg.tar.zst; do mv "$pkg" artifacts/; done
          for src in pkgbuild/ins/*.src.tar.zst; do mv "$src" artifacts/; done
      - name: Upload Arch package
        uses: actions/upload-artifact@v7
        with:
          name: ins-${{ steps.vars.outputs.version }}-arch-packages
          path: artifacts/
  deb:
    name: Build Debian package
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install dependencies
        run: apt-get update && apt-get install -y dpkg-dev
      - name: Extract version
        id: vars
        run: |
          version=$(awk -F '"' '/^version =/ {print $2; exit}' Cargo.toml)
          if [[ -z "$version" ]]; then
            echo "Failed to determine version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Download native build artifact
        uses: actions/download-artifact@v8
        with:
          name: ins-${{ steps.vars.outputs.version }}-x86_64-unknown-linux-gnu
          path: dist
      - name: Extract binary from tarball
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          tar -xzf "dist/ins-x86_64-unknown-linux-gnu-v${VERSION}.tgz" -C dist
          install -Dm0755 "dist/ins-x86_64-unknown-linux-gnu-v${VERSION}/ins" target/release/ins
      - name: Build .deb package
        run: |
          chmod +x utils/build_deb.sh
          ./utils/build_deb.sh
      - name: Collect deb artifacts
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          mkdir -p artifacts
          mv target/deb/ins_${VERSION}_amd64.deb artifacts/
          cd artifacts && sha256sum ins_${VERSION}_amd64.deb > ins_${VERSION}_amd64.deb.sha256
      - name: Upload deb package
        uses: actions/upload-artifact@v7
        with:
          name: ins-${{ steps.vars.outputs.version }}-deb
          path: artifacts/
  release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    needs:
      - build
      - cross-compile
      - pkgbuild
      - deb
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
